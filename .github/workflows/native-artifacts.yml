name: Native artifacts

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run Rust test suite
        run: cargo +stable test --locked

  release_targets:
    name: Resolve release targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate native runner matrix
        id: targets
        run: echo "matrix=$(scripts/release/release-targets.sh --github-matrix)" >> "$GITHUB_OUTPUT"

  package:
    needs:
      - test
      - release_targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "${{ matrix.target }}"
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
      - name: Ensure xz is available on macOS
        if: runner.os == 'macOS'
        run: command -v xz >/dev/null || brew install xz
      - name: Build release binary
        run: cargo +stable build --release --locked --target "${{ matrix.target }}"
      - name: Package and smoke-test archive
        id: package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/tmup"
          binary_version=$("$binary" --version)
          version=${binary_version#tmup }
          tag="v$version"
          scripts/release/package.sh "$tag" "${{ matrix.target }}" "$binary" "$PWD/dist"
          echo "artifact_name=tmup-$tag-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: Upload archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - test
      - package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          version=$(scripts/release/validate-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA")
          {
            printf 'tag=%s\n' "$GITHUB_REF_NAME"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - name: Download tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tmup-v${{ steps.release.outputs.version }}-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Prepare complete release asset set
        run: scripts/release/prepare-assets.sh "${{ steps.release.outputs.tag }}" "$PWD/downloaded-artifacts" "$PWD/release"
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/publish-release.sh "${{ steps.release.outputs.tag }}" "$PWD/release"
