name: Native artifacts

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run Rust test suite
        run: cargo +stable test --locked

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            macos_deployment_target: "10.12"
          - runner: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "${{ matrix.target }}"
      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo +stable build --release --locked --target "${{ matrix.target }}"
      - name: Package and smoke-test archive
        id: package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/tmup"
          binary_version=$("$binary" --version)
          version=${binary_version#tmup }
          tag="v$version"
          archive=$(scripts/release/package.sh "$tag" "${{ matrix.target }}" "$binary" "$PWD/dist")
          scripts/release/validate-archive.sh "$tag" "${{ matrix.target }}" "$archive"
          artifact_name=$(basename "$archive" .tar.gz)
          {
            printf 'archive=%s\n' "$archive"
            printf 'artifact_name=%s\n' "$artifact_name"
          } >> "$GITHUB_OUTPUT"
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - test
      - package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          version=$(scripts/release/validate-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA")
          {
            printf 'tag=%s\n' "$GITHUB_REF_NAME"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"
      - name: Download tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tmup-v${{ steps.release.outputs.version }}-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Prepare complete release asset set
        run: scripts/release/prepare-assets.sh "${{ steps.release.outputs.tag }}" "$PWD/downloaded-artifacts" "$PWD/release"
      - name: Generate provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Verify provenance attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/publish-release.sh "${{ steps.release.outputs.tag }}" "$PWD/release"
