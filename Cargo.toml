[package]
name = "tmup"
version = "0.1.0-rc.2"
edition = "2024"

[dependencies]
anstream = "1"
base16ct = { version = "1.0", features = ["alloc"] }
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
glob = "0.3"
fd-lock = "4"
kdl = "6"
owo-colors = "4.3.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shellexpand = "3.1"
tabled = { version = "0.20", default-features = false, features = ["std", "ansi"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
