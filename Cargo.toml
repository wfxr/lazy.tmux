[package]
name = "tmup"
version = "0.3.1"
edition = "2024"
description = "A modern, config-driven tmux plugin manager"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/wfxr/tmup"
repository = "https://github.com/wfxr/tmup"
keywords = ["tmux", "plugin-manager", "terminal", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anstream = "1"
base16ct = { version = "1.0", features = ["alloc"] }
anyhow = "1"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
glob = "0.3"
fd-lock = "4"
kdl = "6"
libc = "0.2"
owo-colors = "4.3.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shellexpand = "3.1"
tabled = { version = "0.22", default-features = false, features = ["std", "ansi"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = "symbols"
